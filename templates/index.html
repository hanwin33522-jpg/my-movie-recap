<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineRecap - Auto Movie Downloader & Recap</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; text-align: center; padding: 20px; }
        .box { background: #1f1f1f; padding: 20px; border-radius: 10px; max-width: 500px; margin: auto; }
        input[type="text"] { width: 80%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #e50914; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #b80710; }
        #result { margin-top: 20px; text-align: left; background: #2a2a2a; padding: 15px; border-radius: 5px; display: none; }
        .dl-btn { display: inline-block; margin-top: 10px; padding: 10px 15px; background: #28a745; color: #fff; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Movie Link ဖြင့် Recap နှုတ်ရန်</h2>
        <input type="text" id="movieUrl" placeholder="Movie Link ကို ဒီမှာ Paste ထည့်ပါ...">
        <br>
        <button onclick="generateRecap()">Recap ထုတ်မည် & Download လုပ်မည်</button>

        <div id="loading" style="display:none; margin-top: 10px;">ခေတ္တစောင့်ပါ... ဒေါင်းလုဒ်ဆွဲပြီး Recap လုပ်နေပါသည်...</div>

        <div id="result">
            <h3>Recap ရလဒ်:</h3>
            <p id="recapText"></p>
            <a id="downloadBtn" class="dl-btn" href="#" download>Video/Audio Download ဆွဲမည်</a>
        </div>
    </div>

    <script>
        async function generateRecap() {
            const url = document.getElementById('movieUrl').value;
            if(!url) { alert('Link ထည့်ပေးပါ'); return; }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';

            try {
                const response = await fetch('/process_movie', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();
                document.getElementById('loading').style.display = 'none';

                if(data.success) {
                    document.getElementById('recapText').innerHTML = data.recap;
                    document.getElementById('downloadBtn').href = data.download_link;
                    document.getElementById('result').style.display = 'block';
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                alert('စနစ်ပိုင်းဆိုင်ရာ အမှားအယွင်းရှိနေပါသည်။');
            }
        }
    </script>
</body>
</html>
